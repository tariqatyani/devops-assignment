# Nginx container config: reverse proxy to the Tomcat container on the same Docker network.
# "ps-tomcat" is resolved by Docker's built-in DNS to the Tomcat container's IP.
server {
    listen 80;
    server_name _;

    location = / { return 302 /ps-app/; }

    location / {
        proxy_pass         http://ps-tomcat:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
